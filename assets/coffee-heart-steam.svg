<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" class="coffee-mark" role="img" aria-label="A coffee cup with heart-shaped steam">
  <title>Heart-shaped steam</title>
  <style>
    .coffee-mark{--coffee-ink:#183f38;--coffee-warm:#a6603c;--coffee-fill:#e5eee6;--coffee-paper:#fffdf8}
    @media(prefers-color-scheme:dark){.coffee-mark{--coffee-ink:#a6d5bf;--coffee-warm:#efb86c;--coffee-fill:#17251e;--coffee-paper:#101712}}
  </style>
  <path d="M45 34 32 21c-9-11 5-23 13-12 8-11 22 1 13 12Z" fill="none" stroke="var(--coffee-warm)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g stroke="var(--coffee-ink)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M67 45h7a10 10 0 0 1 0 20h-8" fill="none"/>
    <path d="M21 43h48v16c0 13-10 21-24 21S21 72 21 59Z" fill="var(--coffee-fill)"/>
    <path d="M17 85h60M30 50h29" fill="none"/>
  </g>
