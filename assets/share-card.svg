    <text x="960" y="330" font-family="Georgia, serif" font-size="92" font-weight="700" fill="#47665d">8</text>
    <g data-competency="8">
      <circle cx="960" cy="158" r="23" fill="#faf8f2" stroke="#c8d6c5"/>
      <text x="960" y="165">C8</text>
    </g>
    <g data-competency="1">
      <circle cx="1060.41" cy="199.59" r="23" fill="#faf8f2" stroke="#c8d6c5"/>
      <text x="1060.41" y="206.59">C1</text>
    </g>
    <g data-competency="2">
      <circle cx="1102" cy="300" r="23" fill="#faf8f2" stroke="#c8d6c5"/>
      <text x="1102" y="307">C2</text>
    </g>
    <g data-competency="3">
      <circle cx="1060.41" cy="400.41" r="23" fill="#faf8f2" stroke="#c8d6c5"/>
