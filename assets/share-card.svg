    </g>
    <g data-competency="5">
      <circle cx="859.59" cy="400.41" r="23" fill="#faf8f2" stroke="#c8d6c5"/>
      <text x="859.59" y="407.41">C5</text>
    </g>
    <g data-competency="6">
      <circle cx="818" cy="300" r="23" fill="#faf8f2" stroke="#c8d6c5"/>
      <text x="818" y="307">C6</text>
    </g>
    <g data-competency="7">
      <circle cx="859.59" cy="199.59" r="23" fill="#faf8f2" stroke="#c8d6c5"/>
      <text x="859.59" y="206.59">C7</text>
