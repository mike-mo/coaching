<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">ICF core competency practice</title>
  <desc id="description">Practice the names and explore coaching choices. An eight-competency clock has C8 at the top and C1 at the upper right.</desc>
  <rect width="1200" height="630" fill="#faf8f2"/>
  <rect x="72" y="64" width="56" height="56" rx="16" fill="#183f38"/>
  <text x="100" y="104" text-anchor="middle" font-family="Georgia, serif" font-size="38" font-weight="700" fill="#ffffff">8</text>
  <text x="146" y="100" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#183f38">Coachprep</text>
  <text x="72" y="238" font-family="Georgia, serif" font-size="70" font-weight="700" fill="#203e35">
    <tspan x="72">ICF core</tspan>
    <tspan x="72" dy="88" font-size="62">competency practice</tspan>
  </text>
  <text x="76" y="397" font-family="Arial, sans-serif" font-size="29" fill="#47665d">Practice the names.</text>
  <text x="76" y="440" font-family="Arial, sans-serif" font-size="29" fill="#47665d">Explore coaching choices.</text>
  <g font-family="Arial, sans-serif" font-size="19" text-anchor="middle" fill="#183f38">
